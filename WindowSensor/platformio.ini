; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32 @ ~7.1.3
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
	-D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
lib_deps = 
	tzapu/WiFiManager
	knolleary/PubSubClient
	bblanchon/ArduinoJson
	h2zero/NimBLE-Arduino@2.5.1

; Host-side unit tests for the pure logic headers (needs a native gcc/g++): pio test -e native
[env:native]
platform = native
test_framework = unity
test_filter = test_logic
