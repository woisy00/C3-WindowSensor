name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        working-directory: WindowSensor
        run: pio run          

      - name: Upload firmware File
        uses: actions/upload-artifact@v4
        with:
          name: WindowSensor-ci.bin
          path: WindowSensor/.pio/build/esp32-c3-devkitm-1/firmware.bin