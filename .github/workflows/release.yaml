name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Upload .firmware in release asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF:10}" >> $GITHUB_OUTPUT

      - name: Find release by tag
        id: find_release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = "${{ steps.version.outputs.version }}";
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const rel = releases.data.find(r => r.tag_name === tag);
            if (!rel) {
              core.setFailed(`no release found for tag ${tag}`);
            }
            return { upload_url: rel.upload_url.replace('{?name,label}','') };

      - name: Build PlatformIO Project
        working-directory: WindowSensor
        run: pio run      
        env:
            PLATFORMIO_BUILD_FLAGS: -DVERSION=\"${{ steps.version.outputs.version }}\"

      - name: Upload firmware File
        uses: actions/upload-artifact@v4
        with:
          name: WindowSensor-${{ steps.version.outputs.version }}.bin
          path: WindowSensor/.pio/build/esp32-c3-devkitm-1/firmware.bin

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.find_release.outputs.upload_url }}
          asset_path: WindowSensor/.pio/build/esp32-c3-devkitm-1/firmware.bin
          asset_name: WindowSensor-${{ steps.version.outputs.version }}.bin
          asset_content_type: application/octet-stream
