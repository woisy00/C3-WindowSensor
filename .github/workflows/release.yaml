name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Upload .firmware in release asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1.20.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Window Sensor Release ${{ github.ref }}
          draft: true
          body: |
            ### Release Highlights

            ### Features & Enhancements

            <!-- Insert The Features and Enhancements below as points possibly add the link to the PR/commit -->

            ### Bug Fixes

            <!-- Insert The Bug Fixes below as points, also add relevant links -->

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF:11}" >> $GITHUB_OUTPUT

      - name: Build PlatformIO Project
        working-directory: WindowSensor
        run: pio run      
        env:
            PLATFORMIO_BUILD_FLAGS: -DVERSION=${{ steps.version.outputs.version }}            

      - name: Upload firmware File
        uses: actions/upload-artifact@v4
        with:
          name: WindowSensor-${{ steps.version.outputs.version }}.bin
          path: WindowSensor/.pio/build/esp32-c3-devkitm-1/firmware.bin

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: WindowSensor/.pio/build/esp32-c3-devkitm-1/firmware.bin
          asset_name: WindowSensor-${{ steps.version.outputs.version }}.bin
          asset_content_type: application/octet-stream
